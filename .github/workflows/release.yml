name: Release
on:
  release:
    types:
      - published

env:
  # Stop wasting time caching packages
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending usage data to Microsoft
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FEED: https://packages.proinc.dev/v3/index.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Create Release NuGet package
        run: |
          arrTag=(${GITHUB_REF//\// })
          VERSION="${arrTag[2]}"
          echo Version: $VERSION
          VERSION="${VERSION:1}"
          echo Clean Version: $VERSION
          dotnet pack -v normal -c Release --include-symbols --include-source -p:PackageVersion=$VERSION -o nupkg EntityFrameworkCore.Triggered.slnx
      - name: Push to packages.proinc.dev
        run: |
          for f in ./nupkg/*.nupkg
          do
            dotnet nuget push $f --source $FEED --api-key ${{ secrets.BAGET_API_KEY }} --skip-duplicate --no-symbols
          done
      # Attached so the exact packages pushed are on record next to the source.
      - name: Attach packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" ./nupkg/*.nupkg --repo "${GITHUB_REPOSITORY}"
